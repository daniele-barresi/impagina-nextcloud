# ESLint, Stylelint e build Vite del frontend.
name: Lint JS

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-js-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint-js:
    runs-on: ubuntu-latest
    name: eslint + stylelint + build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Stylelint
        run: npm run stylelint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
